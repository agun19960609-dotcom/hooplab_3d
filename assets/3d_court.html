<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Hooplab 3D Court</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
  let progress = 0;
  let duration = 5.0;
  let ballMesh = null;
  let playbookSteps = [];
  let currentStepIndex = 0;
  let isPlaying3D = true;
  var pendingPlaybookJson = null;
  var pendingAutoplay = false;
  window.loadPlaybook = function (jsonString) {
    console.log('Received JSON in 3D:', jsonString);
    pendingPlaybookJson = jsonString;
    pendingAutoplay = true;
  };
  window.startPlayback = function () {
    pendingAutoplay = true;
  };
  window.loadModelFromBase64 = function () {};
  window.setCameraView = function (viewType) {
    window._pendingCameraView = viewType;
  };
  window.setZoomLevel = function (level) {
    window._pendingZoomLevel = level;
  };

  window.onload = function () {
    if (typeof THREE === 'undefined') {
      console.error('Three.js failed to load');
      return;
    }

    var COURT_WIDTH = 50;
    var COURT_LENGTH = 94;
    var PLAYER_HEIGHT = 5.6;
    var PLAYER_RADIUS = 1.15;
    var HOOP_FROM_BASELINE = 5.25;
    var BACKBOARD_FROM_BASELINE = 4.0;
    var RIM_HEIGHT = 10;

    var scene = new THREE.Scene();

    var camera = new THREE.PerspectiveCamera(
      78,
      window.innerWidth / Math.max(window.innerHeight, 1),
      0.1,
      2000
    );
    var framedTarget = new THREE.Vector3(0, 2.2, -24);
    var BASE_CAM_DISTANCE = 66;
    camera.position.set(0, 22, 36);
    camera.lookAt(framedTarget);

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0x87ceeb);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    var ambient = new THREE.AmbientLight(0xffffff, 0.38);
    scene.add(ambient);
    scene.add(new THREE.HemisphereLight(0xE7F0FF, 0xC4A574, 0.55));

    var sun = new THREE.DirectionalLight(0xfff4e5, 1.05);
    sun.position.set(30, 90, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.bias = -0.0004;
    var shadowSpan = 80;
    sun.shadow.camera.left = -shadowSpan;
    sun.shadow.camera.right = shadowSpan;
    sun.shadow.camera.top = shadowSpan;
    sun.shadow.camera.bottom = -shadowSpan;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 260;
    scene.add(sun);

    function createCourtTexture() {
      var canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1926;
      var ctx = canvas.getContext('2d');
      var W = canvas.width;
      var H = canvas.height;
      var sx = W / COURT_WIDTH;
      var sy = H / COURT_LENGTH;

      function fx(feet) { return feet * sx; }
      function fy(feet) { return feet * sy; }

      ctx.fillStyle = '#C48A4A';
      ctx.fillRect(0, 0, W, H);
      var planks = 12;
      var plankW = W / planks;
      for (var i = 0; i < planks; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#E6B77C' : '#D4A373';
        ctx.fillRect(i * plankW, 0, plankW + 1, H);
      }

      var laneLeft = (COURT_WIDTH - 16) / 2;
      ctx.fillStyle = '#1A2B4C';
      ctx.fillRect(fx(laneLeft), fy(0), fx(16), fy(19));
      ctx.fillRect(fx(laneLeft), fy(COURT_LENGTH - 19), fx(16), fy(19));

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = Math.max(3, sx * 0.22);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      ctx.strokeRect(fx(0) + 2, fy(0) + 2, W - 4, H - 4);

      ctx.beginPath();
      ctx.moveTo(fx(0), fy(COURT_LENGTH / 2));
      ctx.lineTo(fx(COURT_WIDTH), fy(COURT_LENGTH / 2));
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(fx(25), fy(47), 6 * sx, 0, Math.PI * 2);
      ctx.stroke();

      function paintEnd(top) {
        var y0 = top ? 0 : COURT_LENGTH;
        var ftY = top ? 19 : COURT_LENGTH - 19;
        var hoopY = top ? HOOP_FROM_BASELINE : COURT_LENGTH - HOOP_FROM_BASELINE;
        var boardY = top ? BACKBOARD_FROM_BASELINE : COURT_LENGTH - BACKBOARD_FROM_BASELINE;
        var sign = top ? 1 : -1;

        ctx.strokeRect(
          fx(laneLeft),
          fy(Math.min(y0, ftY)),
          fx(16),
          fy(Math.abs(ftY - y0))
        );

        ctx.beginPath();
        ctx.arc(fx(25), fy(ftY), 6 * sx, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(fx(25), fy(hoopY), 4 * sx, top ? 0 : Math.PI, top ? Math.PI : 0);
        ctx.stroke();

        var leftX = 5;
        var rightX = 45;
        var radius = 23.75;
        var dx = 25 - leftX;
        var cornerOffsetY = Math.sqrt(radius * radius - dx * dx);
        var cornerY = hoopY + sign * cornerOffsetY;
        var leftAngle = Math.atan2(sign * cornerOffsetY, -dx);
        var rightAngle = Math.atan2(sign * cornerOffsetY, dx);
        ctx.beginPath();
        ctx.moveTo(fx(leftX), fy(y0));
        ctx.lineTo(fx(leftX), fy(cornerY));
        for (var s = 1; s <= 56; s++) {
          var t = s / 56;
          var angle = leftAngle + (rightAngle - leftAngle) * t;
          ctx.lineTo(fx(25 + radius * Math.cos(angle)), fy(hoopY + radius * Math.sin(angle)));
        }
        ctx.lineTo(fx(rightX), fy(y0));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(fx(22), fy(boardY));
        ctx.lineTo(fx(28), fy(boardY));
        ctx.stroke();
      }

      paintEnd(true);
      paintEnd(false);

      var texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.needsUpdate = true;
      return texture;
    }

    var apron = new THREE.Mesh(
      new THREE.PlaneGeometry(COURT_WIDTH + 10, COURT_LENGTH + 14),
      new THREE.MeshStandardMaterial({ color: 0x5A3A22, roughness: 0.95 })
    );
    apron.rotation.x = -Math.PI / 2;
    apron.position.y = -0.04;
    apron.receiveShadow = true;
    scene.add(apron);

    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(COURT_WIDTH, COURT_LENGTH),
      new THREE.MeshStandardMaterial({
        map: createCourtTexture(),
        color: 0xffffff,
        roughness: 0.78,
        metalness: 0.02,
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    var playerGroup = new THREE.Group();
    scene.add(playerGroup);
    var pathLineGroup = new THREE.Group();
    scene.add(pathLineGroup);

    var actors = [];
    var actorsById = {};
    var ballCarrierId = null;
    var passPath = null;
    var shootPath = null;
    var shootStart = null;
    var standaloneBall = null;
    var clock = new THREE.Clock();

    function addShadowMesh(group, geometry, material, x, y, z, rotX, rotY, rotZ) {
      var mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      if (rotX) mesh.rotation.x = rotX;
      if (rotY) mesh.rotation.y = rotY;
      if (rotZ) mesh.rotation.z = rotZ;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function createHoop(atTopBaseline) {
      var group = new THREE.Group();
      var baselineZ = atTopBaseline ? -COURT_LENGTH / 2 : COURT_LENGTH / 2;
      var inward = atTopBaseline ? 1 : -1;
      var boardZ = baselineZ + inward * BACKBOARD_FROM_BASELINE;
      var rimZ = baselineZ + inward * HOOP_FROM_BASELINE;
      var poleZ = baselineZ - inward * 5.2;
      var steel = new THREE.MeshStandardMaterial({
        color: 0x2A2E33,
        metalness: 0.55,
        roughness: 0.35,
      });
      var padMat = new THREE.MeshStandardMaterial({
        color: 0x1A1D22,
        roughness: 0.7,
      });
      var glass = new THREE.MeshStandardMaterial({
        color: 0xF4F8FF,
        transparent: true,
        opacity: 0.8,
        roughness: 0.08,
        metalness: 0.15,
      });
      var orange = new THREE.MeshStandardMaterial({
        color: 0xE86100,
        roughness: 0.28,
        metalness: 0.45,
      });

      addShadowMesh(group, new THREE.BoxGeometry(4.4, 0.45, 3.2), padMat, 0, 0.22, poleZ);
      addShadowMesh(
        group,
        new THREE.CylinderGeometry(0.42, 0.5, 13.2, 20),
        steel,
        0,
        6.6,
        poleZ
      );
      var boomLen = Math.abs(boardZ - poleZ);
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.28, 0.38, boomLen),
        steel,
        0,
        12.55,
        (boardZ + poleZ) / 2
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.22, 1.4, 0.22),
        steel,
        0,
        11.9,
        boardZ - inward * 0.25
      );

      addShadowMesh(
        group,
        new THREE.BoxGeometry(6.2, 3.7, 0.08),
        steel,
        0,
        RIM_HEIGHT + 1.2,
        boardZ - inward * 0.08
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(6.0, 3.5, 0.1),
        glass,
        0,
        RIM_HEIGHT + 1.2,
        boardZ
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(2.0, 0.06, 0.04),
        orange,
        0,
        RIM_HEIGHT + 0.55,
        boardZ + inward * 0.07
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.06, 1.5, 0.04),
        orange,
        -1.0,
        RIM_HEIGHT + 1.3,
        boardZ + inward * 0.07
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.06, 1.5, 0.04),
        orange,
        1.0,
        RIM_HEIGHT + 1.3,
        boardZ + inward * 0.07
      );

      var braceLen = Math.abs(rimZ - boardZ);
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.1, 0.1, braceLen),
        orange,
        0,
        RIM_HEIGHT,
        (rimZ + boardZ) / 2
      );
      var rim = addShadowMesh(
        group,
        new THREE.TorusGeometry(0.78, 0.07, 12, 32),
        orange,
        0,
        RIM_HEIGHT,
        rimZ,
        Math.PI / 2
      );
      rim.castShadow = true;

      var net = new THREE.Mesh(
        new THREE.CylinderGeometry(0.74, 0.38, 1.25, 12, 1, true),
        new THREE.MeshBasicMaterial({
          color: 0xF4F7FB,
          wireframe: true,
          transparent: true,
          opacity: 0.9,
        })
      );
      net.position.set(0, RIM_HEIGHT - 0.68, rimZ);
      group.add(net);

      scene.add(group);
      return group;
    }

    createHoop(true);
    createHoop(false);

    var HOOP_POSITION = new THREE.Vector3(
      0,
      RIM_HEIGHT,
      -COURT_LENGTH / 2 + HOOP_FROM_BASELINE
    );
    var HOOP_POSITION_SOUTH = new THREE.Vector3(
      0,
      RIM_HEIGHT,
      COURT_LENGTH / 2 - HOOP_FROM_BASELINE
    );

    function hoopForShot(from) {
      if (!from) return HOOP_POSITION;
      var dTop = Math.abs(from.z - HOOP_POSITION.z);
      var dSouth = Math.abs(from.z - HOOP_POSITION_SOUTH.z);
      return dTop <= dSouth ? HOOP_POSITION : HOOP_POSITION_SOUTH;
    }

    function makeBallTexture() {
      var canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#E86100';
      ctx.fillRect(0, 0, 256, 128);
      ctx.strokeStyle = '#1A1A1A';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(128, 0);
      ctx.lineTo(128, 128);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(58, 64, 46, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(198, 64, 46, 0, Math.PI * 2);
      ctx.stroke();
      var texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    var trailMeshes = [];
    var trailHistory = [];

    function ensureBall() {
      if (ballMesh && ballMesh.parent === scene) return ballMesh;
      if (ballMesh && ballMesh.parent) ballMesh.parent.remove(ballMesh);
      ballMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 24, 16),
        new THREE.MeshStandardMaterial({
          map: makeBallTexture(),
          color: 0xffffff,
          roughness: 0.55,
          metalness: 0.02,
        })
      );
      ballMesh.name = 'basketball';
      ballMesh.castShadow = true;
      ballMesh.position.set(0, 1, 0);
      scene.add(ballMesh);
      if (!trailMeshes.length) {
        for (var t = 0; t < 8; t++) {
          var ghost = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 8, 6),
            new THREE.MeshBasicMaterial({
              color: 0xF25E22,
              transparent: true,
              opacity: 0.18,
              depthWrite: false,
            })
          );
          ghost.visible = false;
          scene.add(ghost);
          trailMeshes.push(ghost);
        }
      }
      return ballMesh;
    }
    ensureBall();

    function pushTrail(pos, active) {
      if (!active) {
        trailHistory = [];
        for (var i = 0; i < trailMeshes.length; i++) trailMeshes[i].visible = false;
        return;
      }
      trailHistory.push(pos.clone());
      if (trailHistory.length > trailMeshes.length) trailHistory.shift();
      for (var n = 0; n < trailMeshes.length; n++) {
        var sample = trailHistory[n];
        if (!sample) {
          trailMeshes[n].visible = false;
          continue;
        }
        trailMeshes[n].visible = true;
        trailMeshes[n].position.copy(sample);
        trailMeshes[n].material.opacity = 0.08 + (n / trailMeshes.length) * 0.4;
      }
    }

    var controls = null;
    if (typeof THREE.OrbitControls === 'function') {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0, 0);
      controls.minDistance = 10;
      controls.maxDistance = 280;
      controls.maxPolarAngle = Math.PI / 2 - 0.04;
    } else {
      console.error('OrbitControls failed to load');
    }

    function placeCamera(viewType) {
      var pitched = viewType === 'top';
      var origin = framedTarget.clone();
      origin.x = 0;
      // Stay on the center line, in front of the far hoop, looking at the
      // basket the play attacks. 俯仰 is a steeper pitch on that same line.
      var offset = pitched
        ? new THREE.Vector3(0, 62, 30)
        : new THREE.Vector3(0, 14, 60);
      offset.setLength(BASE_CAM_DISTANCE);
      camera.position.copy(origin).add(offset);
      if (controls) {
        controls.maxPolarAngle = Math.PI / 2 - (pitched ? 0.02 : 0.08);
        controls.minPolarAngle = pitched ? 0.02 : 0.12;
      }
      camera.up.set(0, 1, 0);
      camera.lookAt(origin);
      if (controls) {
        controls.target.copy(origin);
        controls.update();
      }
      camera.updateProjectionMatrix();
    }

    window.setCameraView = function (viewType) {
      placeCamera(viewType);
      if (window._currentZoomLevel) {
        window.setZoomLevel(window._currentZoomLevel);
      }
    };

    window.setZoomLevel = function (level) {
      var n = Number(level);
      if (!isFinite(n) || n <= 0) n = 1;
      window._currentZoomLevel = n;
      var targetDistance = BASE_CAM_DISTANCE / n;
      var origin = controls ? controls.target.clone() : framedTarget.clone();
      var dir = camera.position.clone().sub(origin);
      if (dir.lengthSq() < 1e-8) dir.set(0, 1, 0.001);
      dir.normalize().multiplyScalar(targetDistance);
      camera.position.copy(origin).add(dir);
      camera.lookAt(origin);
      if (controls) controls.update();
    };

    placeCamera('3d');
    if (window._pendingCameraView) {
      window.setCameraView(window._pendingCameraView);
    }
    if (window._pendingZoomLevel) {
      window.setZoomLevel(window._pendingZoomLevel);
    }

    function flutterToWorld(x, y, height) {
      return new THREE.Vector3(
        (x - 0.5) * COURT_WIDTH,
        height || 0,
        (y - 0.5) * COURT_LENGTH
      );
    }

    function mapPath(rawPath, height) {
      var points = [];
      if (!rawPath) return points;
      for (var i = 0; i < rawPath.length; i++) {
        var pt = rawPath[i];
        if (!pt || pt.length < 2) continue;
        points.push(flutterToWorld(Number(pt[0]), Number(pt[1]), height || 0));
      }
      return points;
    }

    function getPositionAlongPath(points, t) {
      if (!points || !points.length) return new THREE.Vector3();
      if (points.length === 1 || t <= 0) return points[0].clone();
      if (t >= 1) return points[points.length - 1].clone();

      var total = 0;
      var lengths = [];
      for (var i = 1; i < points.length; i++) {
        var len = points[i].distanceTo(points[i - 1]);
        lengths.push(len);
        total += len;
      }
      if (total <= 0) return points[points.length - 1].clone();

      var remaining = total * t;
      for (var s = 0; s < lengths.length; s++) {
        var seg = lengths[s];
        if (remaining <= seg) {
          var u = seg === 0 ? 0 : remaining / seg;
          return points[s].clone().lerp(points[s + 1], u);
        }
        remaining -= seg;
      }
      return points[points.length - 1].clone();
    }

    function disposeGroup(group) {
      while (group.children.length) {
        var child = group.children[0];
        child.traverse(function (node) {
          if (node.geometry) node.geometry.dispose();
          var mats = node.material;
          if (!mats) return;
          if (!mats.length) mats = [mats];
          for (var m = 0; m < mats.length; m++) {
            var mat = mats[m];
            if (mat.map) mat.map.dispose();
            mat.dispose();
          }
        });
        group.remove(child);
      }
    }

    function isFiniteVec(v) {
      return !!(v && isFinite(v.x) && isFinite(v.y) && isFinite(v.z));
    }

    var passerId = null;
    var shooterId = null;
    var receiverId = null;
    var passTargetId = null;
    var shotOrigin = null;
    var shotHoop = null;
    var shotArc = 10;

    function facePoint(group, point) {
      if (!group || !point) return;
      var dx = point.x - group.position.x;
      var dz = point.z - group.position.z;
      if (dx * dx + dz * dz < 0.04) return;
      // Yaw only. lookAt pitches the whole body toward a nearby point and
      // lays screeners flat on the court.
      group.rotation.set(0, Math.atan2(dx, dz), 0);
    }

    function keepUpright(group) {
      if (!group) return;
      group.rotation.x = 0;
      group.rotation.z = 0;
    }

    function faceHoop(group) {
      if (!group) return;
      facePoint(group, hoopForShot(group.position));
    }

    function cssHex(hex) {
      return '#' + new THREE.Color(hex).getHexString();
    }

    function shadeColor(hex, factor) {
      var color = new THREE.Color(hex);
      color.multiplyScalar(factor);
      return color;
    }

    function makeNumberTexture(playerNumber) {
      var canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);
      ctx.font = 'bold 188px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 16;
      ctx.strokeStyle = 'rgba(20, 16, 12, 0.55)';
      ctx.strokeText(String(playerNumber), 128, 140);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(playerNumber), 128, 140);
      var texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function makeBadgeTexture(playerNumber, teamColor) {
      var canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);
      ctx.fillStyle = cssHex(teamColor);
      ctx.beginPath();
      ctx.arc(128, 128, 112, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 16;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 148px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(playerNumber), 128, 142);
      var texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createAthlete(teamColor, playerNumber) {
      var group = new THREE.Group();
      var skinMat = new THREE.MeshStandardMaterial({
        color: 0xF6F3EE,
        roughness: 0.82,
        metalness: 0,
      });
      var jerseyMat = new THREE.MeshStandardMaterial({
        color: teamColor,
        roughness: 0.93,
        metalness: 0,
      });
      var shortsMat = new THREE.MeshStandardMaterial({
        color: shadeColor(teamColor, 0.86),
        roughness: 0.94,
        metalness: 0,
      });
      var trimMat = new THREE.MeshStandardMaterial({
        color: 0xF7F7F7,
        roughness: 0.7,
        metalness: 0,
      });
      var shoeMat = new THREE.MeshStandardMaterial({
        color: 0xF4F4F4,
        roughness: 0.58,
        metalness: 0.02,
      });
      var soleMat = new THREE.MeshStandardMaterial({
        color: 0x242424,
        roughness: 0.7,
        metalness: 0,
      });
      var eyeMat = new THREE.MeshStandardMaterial({
        color: 0x2A241F,
        roughness: 0.45,
        metalness: 0,
      });

      function add(parent, geometry, material, x, y, z) {
        var mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      function makeLeg(side) {
        var hip = new THREE.Group();
        hip.name = side < 0 ? 'legL' : 'legR';
        hip.position.set(side * 0.34, 3.18, 0);
        add(hip, new THREE.CylinderGeometry(0.19, 0.16, 1.48, 12), skinMat, 0, -0.74, 0);
        var knee = new THREE.Group();
        knee.name = side < 0 ? 'kneeL' : 'kneeR';
        knee.position.set(0, -1.48, 0);
        add(knee, new THREE.CylinderGeometry(0.15, 0.12, 1.42, 12), skinMat, 0, -0.71, 0);
        add(knee, new THREE.BoxGeometry(0.34, 0.16, 0.62), shoeMat, 0, -1.48, 0.08);
        add(knee, new THREE.BoxGeometry(0.36, 0.06, 0.66), soleMat, 0, -1.58, 0.08);
        hip.add(knee);
        group.add(hip);
      }
      makeLeg(-1);
      makeLeg(1);

      add(group, new THREE.CylinderGeometry(0.52, 0.62, 1.05, 16), shortsMat, 0, 2.82, 0);
      add(group, new THREE.CylinderGeometry(0.63, 0.64, 0.08, 16), trimMat, 0, 2.32, 0);

      var torso = add(group, new THREE.CylinderGeometry(0.52, 0.58, 1.62, 16), jerseyMat, 0, 4.08, 0);
      torso.scale.z = 0.76;
      var yoke = add(group, new THREE.CylinderGeometry(0.18, 0.18, 1.45, 12), jerseyMat, 0, 4.78, 0);
      yoke.rotation.z = Math.PI / 2;
      add(group, new THREE.SphereGeometry(0.3, 14, 12), jerseyMat, -0.66, 4.74, 0);
      add(group, new THREE.SphereGeometry(0.3, 14, 12), jerseyMat, 0.66, 4.74, 0);
      var hem = add(group, new THREE.CylinderGeometry(0.6, 0.6, 0.08, 16), trimMat, 0, 3.28, 0);
      hem.scale.z = 0.76;
      add(group, new THREE.CylinderGeometry(0.2, 0.24, 0.12, 12), trimMat, 0, 4.92, 0);

      var numberMat = new THREE.MeshBasicMaterial({
        map: makeNumberTexture(playerNumber),
        transparent: true,
        depthWrite: false,
      });
      var numberBackMat = numberMat.clone();
      numberBackMat.map = makeNumberTexture(playerNumber);
      var chest = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 1.12), numberMat);
      chest.position.set(0, 4.12, 0.52);
      group.add(chest);
      var back = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 1.12), numberBackMat);
      back.position.set(0, 4.12, -0.52);
      back.rotation.y = Math.PI;
      group.add(back);

      add(group, new THREE.CylinderGeometry(0.16, 0.18, 0.28, 12), skinMat, 0, 5.18, 0);
      add(group, new THREE.SphereGeometry(0.42, 20, 16), skinMat, 0, 5.68, 0);
      add(group, new THREE.SphereGeometry(0.05, 10, 8), eyeMat, -0.13, 5.74, 0.48);
      add(group, new THREE.SphereGeometry(0.05, 10, 8), eyeMat, 0.13, 5.74, 0.48);

      function makeArm(side) {
        var arm = new THREE.Group();
        arm.name = side < 0 ? 'armL' : 'armR';
        arm.position.set(side * 0.78, 4.7, 0);
        add(arm, new THREE.CylinderGeometry(0.13, 0.12, 1.18, 12), skinMat, 0, -0.59, 0);
        var elbow = new THREE.Group();
        elbow.name = side < 0 ? 'elbowL' : 'elbowR';
        elbow.position.set(0, -1.18, 0);
        add(elbow, new THREE.CylinderGeometry(0.11, 0.1, 1.08, 12), skinMat, 0, -0.54, 0);
        var hand = new THREE.Group();
        hand.name = side < 0 ? 'handL' : 'handR';
        hand.position.set(0, -1.12, 0);
        add(hand, new THREE.SphereGeometry(0.13, 12, 10), skinMat, 0, 0, 0);
        var hold = new THREE.Object3D();
        hold.name = side < 0 ? 'holdL' : 'holdR';
        hold.position.set(0, -0.16, 0);
        hand.add(hold);
        elbow.add(hand);
        arm.add(elbow);
        group.add(arm);
      }
      makeArm(-1);
      makeArm(1);

      var chestHold = new THREE.Object3D();
      chestHold.name = 'chestHold';
      chestHold.position.set(0.15, 4.55, 1.05);
      group.add(chestHold);

      var badge = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeBadgeTexture(playerNumber, teamColor),
        depthTest: true,
      }));
      badge.name = 'badge';
      badge.position.set(0, 6.95, 0);
      badge.scale.set(1.45, 1.45, 1);
      group.add(badge);

      var ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.78, 0.045, 8, 28),
        new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.55, metalness: 0.04 })
      );
      ring.name = 'floorRing';
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.045;
      ring.receiveShadow = true;
      group.add(ring);

      group.updateMatrixWorld(true);
      var minY = Infinity;
      group.traverse(function (node) {
        if (!node.isMesh || node.name === 'floorRing') return;
        var box = new THREE.Box3().setFromObject(node);
        if (box.min.y < minY) minY = box.min.y;
      });
      if (isFinite(minY)) {
        for (var i = 0; i < group.children.length; i++) {
          if (group.children[i].name === 'floorRing') continue;
          group.children[i].position.y -= minY;
        }
      }
      ring.position.y = 0.045;
      group.scale.setScalar(0.5);
      return group;
    }

    function worldOf(actor, nodeName) {
      var point = new THREE.Vector3();
      if (!actor || !actor.mesh) return point;
      actor.mesh.updateMatrixWorld(true);
      var node = actor.mesh.getObjectByName(nodeName);
      if (node) {
        node.getWorldPosition(point);
        if (isFiniteVec(point)) return point;
      }
      point.set(actor.mesh.position.x, 2.2, actor.mesh.position.z);
      return point;
    }

    function handsMid(actor) {
      return worldOf(actor, 'handR').add(worldOf(actor, 'handL')).multiplyScalar(0.5);
    }

    function smoothstep(t) {
      var x = Math.max(0, Math.min(1, t));
      return x * x * (3 - 2 * x);
    }

    // Softer ease-in/out than smoothstep. Applied to playback time, not to
    // getPositionAlongPath, so arc-length sampling stays linear.
    function smootherstep(t) {
      var x = Math.max(0, Math.min(1, t));
      return x * x * x * (x * (x * 6 - 15) + 10);
    }

    function approachYaw(group, targetYaw, delta) {
      if (!group || !isFinite(targetYaw)) return;
      var current = group.rotation.y;
      var diff = targetYaw - current;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      var dt = Math.max(0, Math.min(delta || 0, 0.05));
      var alpha = 1 - Math.exp(-dt * 8);
      group.rotation.set(0, current + diff * alpha, 0);
    }

    function setFacing(actor, point) {
      if (!actor || !actor.mesh || !point) return;
      var dx = point.x - actor.mesh.position.x;
      var dz = point.z - actor.mesh.position.z;
      if (dx * dx + dz * dz < 0.04) return;
      actor.yawTarget = Math.atan2(dx, dz);
    }

    function phaseAt(t) {
      var hasPass = !!(passPath && passPath.length > 1);
      var hasShoot = shooterId != null && !!shootPath;
      // A pass finishes well before the step so the ball is snappier than the jog.
      // Pass-then-shoot keeps the same gather/shoot window as before.
      var passEnd = hasPass ? (hasShoot ? 0.4 : 0.42) : 0;
      var gatherEnd = hasShoot ? (hasPass ? 0.56 : 0.22) : 1;
      if (hasPass && t < passEnd) {
        return { name: 'pass', u: t / Math.max(passEnd, 0.001), passEnd: passEnd, gatherEnd: gatherEnd };
      }
      if (hasShoot && t < gatherEnd) {
        return {
          name: 'gather',
          u: (t - passEnd) / Math.max(gatherEnd - passEnd, 0.001),
          passEnd: passEnd,
          gatherEnd: gatherEnd,
        };
      }
      if (hasShoot) {
        return {
          name: 'shoot',
          u: (t - gatherEnd) / Math.max(1 - gatherEnd, 0.001),
          passEnd: passEnd,
          gatherEnd: gatherEnd,
        };
      }
      return { name: 'hold', u: t, passEnd: passEnd, gatherEnd: gatherEnd };
    }

    function applyPose(actor, pose, amount) {
      var mesh = actor.mesh;
      var armL = mesh.getObjectByName('armL');
      var armR = mesh.getObjectByName('armR');
      var elbowL = mesh.getObjectByName('elbowL');
      var elbowR = mesh.getObjectByName('elbowR');
      var legL = mesh.getObjectByName('legL');
      var legR = mesh.getObjectByName('legR');
      var kneeL = mesh.getObjectByName('kneeL');
      var kneeR = mesh.getObjectByName('kneeR');
      if (!armL || !armR || !legL || !legR) return;
      var lift = amount == null ? 1 : Math.max(0, Math.min(1, amount));
      function setRot(obj, x, y, z) {
        if (obj) obj.rotation.set(x, y, z);
      }
      setRot(armL, 0, 0, 0);
      setRot(armR, 0, 0, 0);
      setRot(elbowL, 0, 0, 0);
      setRot(elbowR, 0, 0, 0);
      setRot(legL, 0, 0, 0);
      setRot(legR, 0, 0, 0);
      setRot(kneeL, 0, 0, 0);
      setRot(kneeR, 0, 0, 0);
      mesh.position.y = 0;

      var easedMove = smootherstep(Math.max(0, Math.min(1, progress)));
      var moving = actor.path && actor.path.length > 1 && easedMove > 0.015 && easedMove < 0.94;
      var swing = Math.sin(Date.now() * 0.009) * 0.7;

      if (pose === 'shoot') {
        setRot(armL, -2.25 * lift, 0, -0.28 * lift);
        setRot(armR, -2.45 * lift, 0, 0.22 * lift);
        setRot(elbowL, -0.35 * lift, 0, 0);
        setRot(elbowR, -0.28 * lift, 0, 0);
        setRot(legL, -0.12 * lift, 0, 0);
        setRot(legR, -0.2 * lift, 0, 0);
        setRot(kneeL, 0.28 * lift, 0, 0);
        setRot(kneeR, 0.4 * lift, 0, 0);
        return;
      }
      if (pose === 'pass') {
        setRot(armR, -1.45 * lift, 0, 0.1 * lift);
        setRot(elbowR, -0.25 * lift, 0, 0);
        setRot(armL, -0.7 * lift, 0, -0.16 * lift);
        setRot(elbowL, -0.45 * lift, 0, 0);
        if (moving) {
          setRot(legL, -swing * 0.35, 0, 0);
          setRot(legR, swing * 0.35, 0, 0);
        }
        return;
      }
      if (pose === 'catch') {
        setRot(armL, -1.15 * lift, 0, -0.34 * lift);
        setRot(armR, -1.15 * lift, 0, 0.34 * lift);
        setRot(elbowL, -0.85 * lift, 0, 0);
        setRot(elbowR, -0.85 * lift, 0, 0);
        if (moving) {
          setRot(legL, -swing * 0.35, 0, 0);
          setRot(legR, swing * 0.35, 0, 0);
        }
        return;
      }
      if (pose === 'screen') {
        // Standing screen: wide base, hands together in front of the chest.
        // +Z on the left arm and -Z on the right arm turn the arms inward.
        setRot(armL, -0.4, 0, 0.8);
        setRot(armR, -0.4, 0, -0.8);
        setRot(elbowL, -1.5, 0, 0.12);
        setRot(elbowR, -1.5, 0, -0.12);
        setRot(legL, 0, 0, -0.22);
        setRot(legR, 0, 0, 0.22);
        setRot(kneeL, 0.34, 0, 0);
        setRot(kneeR, 0.34, 0, 0);
        return;
      }
      if (pose === 'run' || moving) {
        setRot(armL, swing, 0, -0.18);
        setRot(armR, -swing, 0, 0.18);
        setRot(elbowL, -0.5, 0, 0);
        setRot(elbowR, -0.5, 0, 0);
        setRot(legL, -swing, 0, 0);
        setRot(legR, swing, 0, 0);
        mesh.position.y = Math.abs(Math.sin(Date.now() * 0.009)) * 0.12;
        return;
      }
      setRot(armL, -0.28, 0, -0.2);
      setRot(armR, -0.28, 0, 0.2);
      setRot(elbowL, -0.55, 0, 0);
      setRot(elbowR, -0.55, 0, 0);
    }

    function faceScreenLine(actor) {
      if (!actor || !actor.mesh) return;
      var handler = null;
      if (ballCarrierId != null && actorsById[ballCarrierId] && actorsById[ballCarrierId] !== actor) {
        handler = actorsById[ballCarrierId];
      }
      if (handler && handler.mesh) {
        setFacing(actor, handler.mesh.position);
        return;
      }
      if (!actor.path || actor.path.length < 2) {
        setFacing(actor, hoopForShot(actor.mesh.position));
        return;
      }
      var from = actor.path[actor.path.length - 2];
      var end = actor.path[actor.path.length - 1];
      var dx = end.x - from.x;
      var dz = end.z - from.z;
      if (dx * dx + dz * dz < 0.0001) {
        setFacing(actor, hoopForShot(actor.mesh.position));
        return;
      }
      // Chest across the screen when no ballhandler is on the floor.
      setFacing(actor, { x: actor.mesh.position.x - dz, z: actor.mesh.position.z + dx });
    }

    function faceAlongTravel(actor, eased) {
      var lookT = Math.min(0.98, Math.max(0.04, eased) + 0.12);
      setFacing(actor, getPositionAlongPath(actor.path, lookT));
    }

    function faceActor(actor, phase, eased) {
      if (!actor || !actor.mesh) return;
      var travel = pathTravel(actor.path);
      if (actor.actionType === 'screen') {
        faceScreenLine(actor);
      } else if (actor.id === passerId && phase.name === 'pass') {
        var recv = actorsById[receiverId];
        if (recv) setFacing(actor, recv.mesh.position);
        else if (passPath && passPath.length) setFacing(actor, passPath[passPath.length - 1]);
        else setFacing(actor, hoopForShot(actor.mesh.position));
      } else if (actor.id === shooterId && (phase.name === 'gather' || phase.name === 'shoot')) {
        setFacing(actor, hoopForShot(actor.mesh.position));
      } else if (travel > 2 && eased < 0.88) {
        faceAlongTravel(actor, eased);
      } else {
        // Stopped players turn off the last path tangent and face the rim.
        setFacing(actor, hoopForShot(actor.mesh.position));
      }
    }

    function choosePose(actor, phase) {
      if (actor.actionType === 'screen') return 'screen';
      if (shooterId != null && actor.id === shooterId && (phase.name === 'gather' || phase.name === 'shoot')) {
        return 'shoot';
      }
      if (passerId != null && actor.id === passerId && phase.name === 'pass') return 'pass';
      if (receiverId != null && actor.id === receiverId && phase.name === 'pass' && phase.u > 0.3) return 'catch';
      if (receiverId != null && actor.id === receiverId && phase.name === 'gather' && actor.id !== shooterId) {
        return 'catch';
      }
      var easedMove = smootherstep(Math.max(0, Math.min(1, progress)));
      if (actor.path && actor.path.length > 1 && easedMove > 0.015 && easedMove < 0.94) return 'run';
      return 'idle';
    }

    function pathColor(actionType) {
      if (actionType === 'pass') return 0x1E88E5;
      if (actionType === 'screen') return 0x9E9E9E;
      if (actionType === 'shoot') return 0xF26A21;
      return 0xE53935;
    }

    function addPathLine(points, actionType) {
      if (!points || points.length < 2) return;
      var lifted = [];
      for (var i = 0; i < points.length; i++) {
        lifted.push(new THREE.Vector3(points[i].x, 0.12, points[i].z));
      }
      var geometry = new THREE.BufferGeometry().setFromPoints(lifted);
      var dashed = actionType === 'pass' || actionType === 'shoot';
      var material = dashed
        ? new THREE.LineDashedMaterial({
            color: pathColor(actionType),
            dashSize: 0.55,
            gapSize: 0.42,
            transparent: true,
            opacity: 0.42,
          })
        : new THREE.LineBasicMaterial({
            color: pathColor(actionType),
            transparent: true,
            opacity: 0.36,
          });
      var line = new THREE.Line(geometry, material);
      if (dashed) line.computeLineDistances();
      pathLineGroup.add(line);
    }

    function addPlayer(playerId, worldPath, isOffense) {
      if (!worldPath.length) return;
      var start = worldPath[0];
      if (!isFiniteVec(start)) return;
      var color = isOffense ? 0xE4570E : 0x1E5BC6;
      var jerseyNumber = playerId >= 11 ? playerId - 10 : playerId;
      var mesh = createAthlete(color, jerseyNumber);
      mesh.userData.team = isOffense ? 'offense' : 'defense';
      mesh.position.set(start.x, 0, start.z);
      faceHoop(mesh);
      playerGroup.add(mesh);
      var actor = {
        id: playerId,
        mesh: mesh,
        path: worldPath,
        actionType: 'run',
      };
      actors.push(actor);
      actorsById[playerId] = actor;
    }

    function pathTravel(path) {
      if (!path || path.length < 2) return 0;
      var dist = 0;
      for (var i = 1; i < path.length; i++) {
        dist += Math.hypot(path[i].x - path[i - 1].x, path[i].z - path[i - 1].z);
      }
      return dist;
    }

    function durationFor(moves, pass, shoot) {
      var longest = 0;
      for (var id in moves) {
        longest = Math.max(longest, pathTravel(moves[id]));
      }
      if (pass && pass.length > 1) longest = Math.max(longest, 10);
      if (shoot) longest = Math.max(longest, 14);
      // A setup step with almost no travel should not sit for five seconds.
      if (longest < 2.5) return 1.05;
      return Math.max(2.05, Math.min(3.5, 1.25 + longest / 14));
    }

    function parseStep(raw) {
      var starts = {};
      var moves = {};
      var actionTypes = {};
      var offenseFlags = {};
      var ballCarrier = null;
      var floorBall = null;
      var pass = null;
      var shoot = null;
      var passer = null;
      var shooter = null;
      var passTarget = null;
      var routes = [];
      var actions = (raw && raw.actions) || [];
      for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        if (!action) continue;
        if (action.actionType === 'dribble') {
          var carrier = Number(action.playerId);
          if (carrier > 0) {
            ballCarrier = carrier;
            floorBall = null;
          } else {
            ballCarrier = null;
            var floorPts = mapPath(action.path, 0);
            floorBall = floorPts.length ? floorPts[0] : null;
          }
          continue;
        }
        var id = Number(action.playerId);
        var isOffense = id >= 1 && id <= 5;
        var isDefense = id >= 11 && id <= 15;
        if (!isOffense && !isDefense) continue;
        offenseFlags[id] = isOffense;
        var worldPath = mapPath(action.path, 0);
        if (!worldPath.length) continue;
        if (worldPath.length === 1) {
          starts[id] = worldPath[0];
          if (!actionTypes[id]) actionTypes[id] = action.actionType || 'run';
        } else if (action.actionType === 'pass') {
          if (!pass || id === ballCarrier) pass = worldPath;
          passer = id;
          if (action.targetPlayerId != null && action.targetPlayerId !== '') {
            var targetId = Number(action.targetPlayerId);
            if (targetId > 0) passTarget = targetId;
          }
          if (!starts[id]) starts[id] = worldPath[0];
          if (!actionTypes[id] || actionTypes[id] === 'run' || actionTypes[id] === 'move') {
            actionTypes[id] = 'pass';
          }
          routes.push({ points: worldPath, actionType: 'pass' });
        } else if (action.actionType === 'shoot') {
          shoot = worldPath;
          shooter = id;
          actionTypes[id] = 'shoot';
          if (!starts[id]) starts[id] = worldPath[0];
          routes.push({ points: worldPath, actionType: 'shoot' });
        } else {
          moves[id] = worldPath;
          starts[id] = worldPath[0];
          actionTypes[id] = action.actionType;
          routes.push({ points: worldPath, actionType: action.actionType });
        }
      }
      return {
        starts: starts,
        moves: moves,
        actionTypes: actionTypes,
        offenseFlags: offenseFlags,
        ballCarrier: ballCarrier,
        floorBall: floorBall,
        pass: pass,
        shoot: shoot,
        passerId: passer,
        shooterId: shooter,
        passTargetId: passTarget,
        routes: routes,
        duration: durationFor(moves, pass, shoot),
      };
    }

    function resolveReceiver() {
      if (passTargetId && actorsById[passTargetId] && passTargetId !== passerId) return passTargetId;
      if (!passPath || !passPath.length) {
        return shooterId != null && shooterId !== passerId ? shooterId : null;
      }
      var end = passPath[passPath.length - 1];
      var best = null;
      var bestD = 16;
      for (var i = 0; i < actors.length; i++) {
        var actor = actors[i];
        if (actor.id === passerId) continue;
        if (actor.id < 1 || actor.id > 5) continue;
        var points = [actor.mesh.position];
        if (actor.path && actor.path.length) {
          points.push(actor.path[0]);
          points.push(actor.path[actor.path.length - 1]);
        }
        for (var p = 0; p < points.length; p++) {
          var dist = Math.hypot(points[p].x - end.x, points[p].z - end.z);
          if (dist < bestD) {
            bestD = dist;
            best = actor.id;
          }
        }
      }
      if (best == null && shooterId != null && shooterId !== passerId) return shooterId;
      return best;
    }

    function applyCurrentStep() {
      var step = playbookSteps[currentStepIndex];
      if (!step) return;
      ballCarrierId = step.ballCarrier;
      standaloneBall = step.floorBall;
      passPath = step.pass;
      shootPath = step.shoot;
      passerId = step.passerId;
      shooterId = step.shooterId;
      passTargetId = step.passTargetId;
      shotOrigin = null;
      shotHoop = null;
      trailHistory = [];
      disposeGroup(pathLineGroup);
      for (var r = 0; r < step.routes.length; r++) {
        addPathLine(step.routes[r].points, step.routes[r].actionType);
      }
      for (var i = 0; i < actors.length; i++) {
        var actor = actors[i];
        var start = step.starts[actor.id];
        var move = step.moves[actor.id];
        actor.actionType = step.actionTypes[actor.id] || 'run';
        if (move && move.length > 1) {
          actor.path = move;
        } else if (start) {
          actor.path = [start];
        } else if (actor.path && actor.path.length) {
          actor.path = [actor.path[actor.path.length - 1]];
        } else {
          actor.path = [];
        }
        var origin = actor.path[0];
        if (origin && isFiniteVec(origin)) {
          actor.mesh.position.set(origin.x, 0, origin.z);
        }
      }
      if (shooterId == null) {
        for (var s = 0; s < actors.length; s++) {
          if (actors[s].actionType === 'shoot') shooterId = actors[s].id;
        }
      }
      if (passerId == null) {
        for (var p = 0; p < actors.length; p++) {
          if (actors[p].actionType === 'pass') passerId = actors[p].id;
        }
      }
      receiverId = resolveReceiver();
      var phase = phaseAt(0);
      var easedNow = smootherstep(Math.max(0, Math.min(1, progress)));
      for (var n = 0; n < actors.length; n++) {
        faceActor(actors[n], phase, easedNow);
        applyPose(actors[n], choosePose(actors[n], phase), 1);
      }
      console.log(
        '3D step', currentStepIndex + 1, '/', playbookSteps.length,
        'ballCarrierId:', ballCarrierId,
        'passer:', passerId,
        'receiver:', receiverId,
        'shooter:', shooterId
      );
    }

    function framePlayers() {
      if (!actors.length) return;
      var cx = 0;
      var cz = 0;
      for (var i = 0; i < actors.length; i++) {
        cx += actors[i].mesh.position.x;
        cz += actors[i].mesh.position.z;
      }
      cx /= actors.length;
      cz /= actors.length;
      var hoop = hoopForShot(new THREE.Vector3(cx, 0, cz));
      framedTarget.set(0, 2.2, cz * 0.5 + hoop.z * 0.5);
      window.setCameraView(window._pendingCameraView || '3d');
    }

    function applyPlaybook(jsonString) {
      console.log('Received JSON in 3D:', jsonString);
      var playbook;
      try {
        playbook = typeof jsonString === 'string' ? JSON.parse(jsonString) : jsonString;
      } catch (err) {
        console.error('Failed to parse playbook JSON', err);
        return;
      }

      ensureBall();
      disposeGroup(playerGroup);
      disposeGroup(pathLineGroup);
      actors = [];
      actorsById = {};
      ballCarrierId = null;
      passPath = null;
      shootPath = null;
      shootStart = null;
      passerId = null;
      shooterId = null;
      receiverId = null;
      passTargetId = null;
      shotOrigin = null;
      shotHoop = null;
      standaloneBall = null;
      progress = 0;
      currentStepIndex = 0;
      isPlaying3D = true;

      var rawSteps = [];
      if (Array.isArray(playbook)) {
        rawSteps = playbook;
      } else if (playbook && Array.isArray(playbook.steps)) {
        rawSteps = playbook.steps;
      }
      playbookSteps = [];
      for (var s = 0; s < rawSteps.length; s++) {
        playbookSteps.push(parseStep(rawSteps[s]));
      }

      disposeGroup(playerGroup);
      actors = [];
      actorsById = {};
      var spawned = {};
      for (var p = 0; p < playbookSteps.length; p++) {
        var starts = playbookSteps[p].starts;
        var ids = Object.keys(starts);
        for (var n = 0; n < ids.length; n++) {
          var pid = Number(ids[n]);
          if (spawned[pid]) continue;
          spawned[pid] = true;
          addPlayer(pid, [starts[pid]], pid >= 1 && pid <= 5);
        }
      }
      applyCurrentStep();
      framePlayers();
      isPlaying3D = true;
      clock.getDelta();
      console.log('Loaded steps:', playbookSteps.length, 'players:', actors.length);
    }

    function beginPlayback() {
      if (!playbookSteps.length) return;
      currentStepIndex = 0;
      progress = 0;
      isPlaying3D = true;
      shotOrigin = null;
      shotHoop = null;
      applyCurrentStep();
      framePlayers();
      clock.getDelta();
    }

    function updateBall(delta, phase) {
      var ballPos = new THREE.Vector3(0, 1.2, 0);
      var flying = false;
      if (phase.name === 'shoot' && shooterId != null && actorsById[shooterId]) {
        var shooter = actorsById[shooterId];
        if (!shotOrigin) {
          shotOrigin = handsMid(shooter);
          if (!isFiniteVec(shotOrigin) || shotOrigin.y < 1.5) {
            shotOrigin = worldOf(shooter, 'chestHold');
            shotOrigin.y = Math.max(shotOrigin.y, 2.3);
          }
          shotHoop = hoopForShot(shotOrigin).clone();
          var dist = Math.hypot(shotHoop.x - shotOrigin.x, shotHoop.z - shotOrigin.z);
          shotArc = Math.max(6.5, Math.min(15, 4.2 + dist * 0.34));
        }
        var flight = Math.min(1, phase.u / 0.9);
        var rimPoint = new THREE.Vector3(shotHoop.x, RIM_HEIGHT, shotHoop.z);
        ballPos.copy(shotOrigin).lerp(rimPoint, flight);
        if (flight < 1) {
          ballPos.y += Math.sin(flight * Math.PI) * shotArc;
        } else {
          var sink = Math.min(1, (phase.u - 0.9) / 0.1);
          ballPos.set(shotHoop.x, RIM_HEIGHT - sink * 1.15, shotHoop.z);
        }
        flying = true;
      } else if (phase.name === 'pass' && passPath && passPath.length > 1) {
        shotOrigin = null;
        var passer = actorsById[passerId];
        var from;
        if (passer) {
          var chest = worldOf(passer, 'chestHold');
          var hand = worldOf(passer, 'handR');
          from = chest.lerp(hand, Math.min(1, phase.u / 0.35));
        } else {
          from = new THREE.Vector3(passPath[0].x, 4.4, passPath[0].z);
        }
        var recv = actorsById[receiverId];
        var to;
        if (recv) {
          to = worldOf(recv, 'chestHold');
        } else {
          var end = passPath[passPath.length - 1];
          to = new THREE.Vector3(end.x, 4.4, end.z);
        }
        ballPos.copy(from).lerp(to, smoothstep(phase.u));
        ballPos.y += Math.sin(phase.u * Math.PI) * 2.8;
        flying = true;
      } else if (
        receiverId != null &&
        actorsById[receiverId] &&
        passPath &&
        passPath.length > 1 &&
        phase.name !== 'gather' &&
        phase.name !== 'shoot'
      ) {
        shotOrigin = null;
        ballPos.copy(worldOf(actorsById[receiverId], 'chestHold'));
      } else if (phase.name === 'gather' && shooterId != null && actorsById[shooterId]) {
        shotOrigin = null;
        var gatherShooter = actorsById[shooterId];
        var gatherFrom = worldOf(gatherShooter, 'chestHold');
        var gatherTo = handsMid(gatherShooter);
        ballPos.copy(gatherFrom.lerp(gatherTo, Math.min(1, phase.u)));
      } else if (ballCarrierId != null && actorsById[ballCarrierId]) {
        shotOrigin = null;
        var holder = actorsById[ballCarrierId];
        var easedHold = smootherstep(Math.max(0, Math.min(1, progress)));
        var dribbling = holder.path && holder.path.length > 1 && easedHold > 0.015 && easedHold < 0.94;
        if (dribbling) {
          var side = new THREE.Vector3(0.72, 0, 0.55);
          side.applyQuaternion(holder.mesh.quaternion);
          var bounce = Math.abs(Math.sin(Date.now() * 0.012));
          ballPos.set(
            holder.mesh.position.x + side.x,
            0.55 + bounce * 1.85,
            holder.mesh.position.z + side.z
          );
        } else {
          ballPos.copy(worldOf(holder, 'chestHold'));
        }
      } else if (standaloneBall && isFiniteVec(standaloneBall)) {
        shotOrigin = null;
        ballPos.set(standaloneBall.x, 0.55, standaloneBall.z);
      }
      if (!isFiniteVec(ballPos)) ballPos.set(0, 1.2, 0);
      ballMesh.position.copy(ballPos);
      ballMesh.visible = true;
      if (flying) {
        ballMesh.rotation.x += delta * 7;
        ballMesh.rotation.y += delta * 4.2;
      }
      pushTrail(ballPos, flying);
    }

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      window.__frames = (window.__frames || 0) + 1;
      var delta = clock.getDelta();
      var stepDur = duration;
      if (playbookSteps[currentStepIndex] && playbookSteps[currentStepIndex].duration) {
        stepDur = playbookSteps[currentStepIndex].duration;
      }
      if (isPlaying3D && playbookSteps.length) {
        progress += delta / stepDur;
        if (progress >= 1.0) {
          if (currentStepIndex < playbookSteps.length - 1) {
            currentStepIndex += 1;
            progress = 0;
            applyCurrentStep();
          } else {
            progress = 1;
            isPlaying3D = false;
          }
        }
      }

      var clamped = Math.max(0, Math.min(1, progress));
      var eased = smootherstep(clamped);
      var phase = phaseAt(clamped);
      for (var i = 0; i < actors.length; i++) {
        var actor = actors[i];
        if (actor.path && actor.path.length > 1) {
          var pos = getPositionAlongPath(actor.path, eased);
          if (isFiniteVec(pos)) actor.mesh.position.set(pos.x, 0, pos.z);
        }
        var pose = choosePose(actor, phase);
        var amount = 1;
        if (pose === 'shoot' && phase.name === 'gather') amount = 0.28 + 0.72 * phase.u;
        if (pose === 'pass') amount = Math.min(1, 0.45 + phase.u);
        if (pose === 'catch') amount = Math.max(0.2, Math.min(1, (phase.u - 0.2) / 0.45));
        faceActor(actor, phase, eased);
        approachYaw(actor.mesh, actor.yawTarget, delta);
        applyPose(actor, pose, amount);
        keepUpright(actor.mesh);
      }

      ensureBall();
      updateBall(delta, phase);

      if (controls) controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.loadPlaybook = applyPlaybook;
    window.startPlayback = beginPlayback;
    window.__debugState = function () {
      var phase = phaseAt(Math.max(0, Math.min(1, progress)));
      return {
        steps: playbookSteps.length,
        step: currentStepIndex,
        progress: progress,
        eased: smootherstep(Math.max(0, Math.min(1, progress))),
        phase: phase.name,
        phaseU: phase.u,
        passerId: passerId,
        shooterId: shooterId,
        receiverId: receiverId,
        shotArc: shotArc,
        release: (function () {
          var actor = shooterId != null ? actorsById[shooterId] : null;
          if (!actor) actor = actors[0];
          if (!actor) return null;
          var hands = handsMid(actor);
          var chest = worldOf(actor, 'chestHold');
          var box = new THREE.Box3().setFromObject(actor.mesh);
          return {
            id: actor.id,
            handY: Math.round(hands.y * 10) / 10,
            handZ: Math.round(hands.z * 10) / 10,
            chestY: Math.round(chest.y * 10) / 10,
            chestZ: Math.round(chest.z * 10) / 10,
            feetZ: Math.round(actor.mesh.position.z * 10) / 10,
            height: Math.round((box.max.y - box.min.y) * 10) / 10,
          };
        })(),
        ball: ballMesh ? [ballMesh.position.x, ballMesh.position.y, ballMesh.position.z] : null,
        hoop: [HOOP_POSITION.x, HOOP_POSITION.y, HOOP_POSITION.z],
        paths: pathLineGroup.children.map(function (line) {
          var mat = line.material;
          return {
            opacity: mat.opacity,
            dashed: !!mat.isLineDashedMaterial,
            dash: mat.dashSize || 0,
          };
        }),
        players: actors.map(function (actor) {
          return {
            id: actor.id,
            action: actor.actionType,
            x: Math.round(actor.mesh.position.x * 10) / 10,
            y: Math.round(actor.mesh.position.y * 10) / 10,
            z: Math.round(actor.mesh.position.z * 10) / 10,
          };
        }),
      };
    };
    window.__focus = function (id) {
      var actor = actorsById[id];
      if (!actor || !actor.mesh) return;
      var p = actor.mesh.position;
      framedTarget.set(p.x, 3.6, p.z);
      camera.position.set(p.x + 8, 5.2, p.z - 7);
      camera.lookAt(p.x, 3.5, p.z);
      if (controls) {
        controls.target.set(p.x, 3.5, p.z);
        controls.update();
      }
    };
    window.__posture = function () {
      var rows = [];
      for (var i = 0; i < actors.length; i++) {
        var actor = actors[i];
        actor.mesh.updateMatrixWorld(true);
        var head = new THREE.Vector3(0, 6.1, 0).applyMatrix4(actor.mesh.matrixWorld);
        rows.push({
          id: actor.id,
          action: actor.actionType,
          rx: Math.round(actor.mesh.rotation.x * 1000) / 1000,
          ry: Math.round(actor.mesh.rotation.y * 1000) / 1000,
          rz: Math.round(actor.mesh.rotation.z * 1000) / 1000,
          yawTarget: actor.yawTarget == null ? null : Math.round(actor.yawTarget * 1000) / 1000,
          headY: Math.round(head.y * 10) / 10,
          x: Math.round(actor.mesh.position.x * 10) / 10,
          z: Math.round(actor.mesh.position.z * 10) / 10,
        });
      }
      var a = actorsById[1];
      var b = actorsById[5];
      var sep = null;
      if (a && b) sep = Math.round(Math.hypot(a.mesh.position.x - b.mesh.position.x, a.mesh.position.z - b.mesh.position.z) * 10) / 10;
      return { sep15: sep, players: rows };
    };
    window.__hands = function (id) {
      var actor = actorsById[id];
      if (!actor) return null;
      actor.mesh.updateMatrixWorld(true);
      var inv = new THREE.Matrix4().copy(actor.mesh.matrixWorld).invert();
      function local(name) {
        var node = actor.mesh.getObjectByName(name);
        if (!node) return null;
        var p = new THREE.Vector3();
        node.getWorldPosition(p);
        p.applyMatrix4(inv);
        return [Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100, Math.round(p.z * 100) / 100];
      }
      return {
        action: actor.actionType,
        handL: local('handL'),
        handR: local('handR'),
        chest: local('chestHold'),
        rx: Math.round(actor.mesh.rotation.x * 1000) / 1000,
        rz: Math.round(actor.mesh.rotation.z * 1000) / 1000,
      };
    };
    window.__frameCheck = function () {
      camera.updateMatrixWorld(true);
      var corners = [
        ['wingL', -22, 1, -8],
        ['wingR', 22, 1, -8],
        ['cornL', -22, 1, -40],
        ['cornR', 22, 1, -40],
        ['nearL', -25, 0, 0],
        ['nearR', 25, 0, 0],
        ['baseL', -25, 0, -47],
        ['baseR', 25, 0, -47],
        ['hoopN', 0, 10, -41.75],
        ['hoopS', 0, 10, 41.75],
      ];
      var ndc = {};
      corners.forEach(function (corner) {
        var p = new THREE.Vector3(corner[1], corner[2], corner[3]).project(camera);
        ndc[corner[0]] = [Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100];
      });
      var playerNdc = actors.map(function (actor) {
        var p = new THREE.Vector3(actor.mesh.position.x, 1, actor.mesh.position.z).project(camera);
        return {
          id: actor.id,
          ndc: [Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100],
        };
      });
      var actor = actors[0];
      var scale = actor && actor.mesh ? actor.mesh.scale.x : null;
      var headY = null;
      if (actor && actor.mesh) {
        actor.mesh.updateMatrixWorld(true);
        var head = new THREE.Vector3(0, 6.1, 0).applyMatrix4(actor.mesh.matrixWorld);
        headY = Math.round(head.y * 10) / 10;
      }
      var target = controls ? controls.target : framedTarget;
      return {
        cam: [
          Math.round(camera.position.x * 10) / 10,
          Math.round(camera.position.y * 10) / 10,
          Math.round(camera.position.z * 10) / 10,
        ],
        target: [
          Math.round(target.x * 10) / 10,
          Math.round(target.y * 10) / 10,
          Math.round(target.z * 10) / 10,
        ],
        fov: camera.fov,
        scale: scale,
        headY: headY,
        ndc: ndc,
        players: playerNdc,
      };
    };
    window.__seek = function (step, t) {
      if (!playbookSteps.length) return null;
      currentStepIndex = Math.max(0, Math.min(playbookSteps.length - 1, Number(step) || 0));
      progress = Math.max(0, Math.min(1, Number(t) || 0));
      isPlaying3D = false;
      shotOrigin = null;
      shotHoop = null;
      applyCurrentStep();
      return window.__debugState();
    };

    function grokPoint(x, y) {
      return [(x / 400) * 0.8 + 0.1, (y / 400) * 0.4 + 0.06];
    }

    function spainPreview() {
      function step(carrier, players) {
        var actions = [];
        for (var i = 0; i < players.length; i++) {
          var player = players[i];
          var path = [];
          for (var k = 0; k < player.path.length; k++) {
            path.push(grokPoint(player.path[k][0], player.path[k][1]));
          }
          var actionType = player.actionType === 'move' ? 'run' : player.actionType;
          if (path.length > 1) actions.push({ playerId: player.id, actionType: 'run', path: [path[0]] });
          actions.push({ playerId: player.id, actionType: actionType, path: path });
        }
        var hold = [grokPoint(200, 320)];
        for (var j = 0; j < players.length; j++) {
          if (players[j].id === carrier) hold = [grokPoint(players[j].path[0][0], players[j].path[0][1])];
        }
        actions.push({ playerId: carrier, actionType: 'dribble', path: hold, targetPlayerId: carrier });
        return { actions: actions };
      }
      return {
        playName: 'Spain Pick & Roll',
        steps: [
          step(1, [
            { id: 1, actionType: 'run', path: [[200, 320], [248, 236]] },
            { id: 5, actionType: 'screen', path: [[188, 168], [296, 204]] },
            { id: 4, actionType: 'run', path: [[372, 36], [328, 118]] },
            { id: 2, actionType: 'run', path: [[52, 210], [58, 178]] },
            { id: 3, actionType: 'move', path: [[24, 40]] },
          ]),
          step(1, [
            { id: 1, actionType: 'run', path: [[248, 236], [330, 180]] },
            { id: 5, actionType: 'run', path: [[296, 204], [214, 78]] },
            { id: 4, actionType: 'screen', path: [[328, 118], [230, 180]] },
            { id: 2, actionType: 'move', path: [[58, 178]] },
            { id: 3, actionType: 'run', path: [[24, 40], [40, 78]] },
          ]),
          step(1, [
            { id: 1, actionType: 'pass', path: [[330, 180], [214, 78]] },
            { id: 5, actionType: 'shoot', path: [[214, 78], [200, 22]] },
            { id: 4, actionType: 'run', path: [[230, 180], [374, 52]] },
            { id: 2, actionType: 'run', path: [[58, 178], [74, 204]] },
            { id: 3, actionType: 'move', path: [[40, 78]] },
          ]),
        ],
      };
    }

    function lineupPreview() {
      var spots = [
        [1, 0.34, 0.30],
        [2, 0.50, 0.22],
        [3, 0.66, 0.30],
        [4, 0.42, 0.14],
        [5, 0.58, 0.14],
        [11, 0.30, 0.38],
        [12, 0.44, 0.36],
        [13, 0.58, 0.36],
        [14, 0.50, 0.18],
        [15, 0.68, 0.38],
      ];
      var actions = [];
      for (var i = 0; i < spots.length; i++) {
        actions.push({ playerId: spots[i][0], actionType: 'run', path: [[spots[i][1], spots[i][2]]] });
      }
      actions.push({ playerId: 1, actionType: 'dribble', path: [[0.34, 0.30]], targetPlayerId: 1 });
      return { playName: 'Lineup', steps: [{ phaseId: 0, actions: actions }] };
    }

    function runPreviewFromQuery() {
      var params;
      try {
        params = new URLSearchParams(window.location.search);
      } catch (err) {
        return;
      }
      var mode = params.get('preview');
      if (!mode) return;
      if (mode === 'spain') applyPlaybook(spainPreview());
      else if (mode === 'lineup') applyPlaybook(lineupPreview());
      else return;
      window.__seek(params.get('step') || 0, params.get('t') || 0);
      if (params.get('zoom')) window.setZoomLevel(params.get('zoom'));
    }

    if (pendingPlaybookJson != null) {
      applyPlaybook(pendingPlaybookJson);
      pendingPlaybookJson = null;
    }
    runPreviewFromQuery();
    if (pendingAutoplay) beginPlayback();
    window.__ready = true;

    console.log('Three.js Scene Initialized Successfully');
  };
</script>
