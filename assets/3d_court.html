<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Hooplab 3D Court</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
  let progress = 0;
  let duration = 5.0;
  let ballMesh = null;
  let playbookSteps = [];
  let currentStepIndex = 0;
  let isPlaying3D = true;
  var pendingPlaybookJson = null;
  window.loadPlaybook = function (jsonString) {
    console.log('Received JSON in 3D:', jsonString);
    pendingPlaybookJson = jsonString;
  };
  window.loadModelFromBase64 = function () {};
  window.setCameraView = function (viewType) {
    window._pendingCameraView = viewType;
  };
  window.setZoomLevel = function (level) {
    window._pendingZoomLevel = level;
  };

  window.onload = function () {
    if (typeof THREE === 'undefined') {
      console.error('Three.js failed to load');
      return;
    }

    var COURT_WIDTH = 50;
    var COURT_LENGTH = 94;
    var PLAYER_HEIGHT = 5.6;
    var PLAYER_RADIUS = 1.15;
    var HOOP_FROM_BASELINE = 5.25;
    var BACKBOARD_FROM_BASELINE = 4.0;
    var RIM_HEIGHT = 10;

    var scene = new THREE.Scene();

    var camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / Math.max(window.innerHeight, 1),
      0.1,
      2000
    );
    camera.position.set(0, 90, 120);
    camera.lookAt(new THREE.Vector3(0, 0, 0));

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0x87ceeb);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    var ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    var sun = new THREE.DirectionalLight(0xffffff, 0.95);
    sun.position.set(30, 90, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.bias = -0.0004;
    var shadowSpan = 80;
    sun.shadow.camera.left = -shadowSpan;
    sun.shadow.camera.right = shadowSpan;
    sun.shadow.camera.top = shadowSpan;
    sun.shadow.camera.bottom = -shadowSpan;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 260;
    scene.add(sun);

    function createCourtTexture() {
      var canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1926;
      var ctx = canvas.getContext('2d');
      var W = canvas.width;
      var H = canvas.height;
      var sx = W / COURT_WIDTH;
      var sy = H / COURT_LENGTH;

      function fx(feet) { return feet * sx; }
      function fy(feet) { return feet * sy; }

      ctx.fillStyle = '#C48A4A';
      ctx.fillRect(0, 0, W, H);
      var planks = 12;
      var plankW = W / planks;
      for (var i = 0; i < planks; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#E6B77C' : '#D4A373';
        ctx.fillRect(i * plankW, 0, plankW + 1, H);
      }

      var laneLeft = (COURT_WIDTH - 16) / 2;
      ctx.fillStyle = '#1A2B4C';
      ctx.fillRect(fx(laneLeft), fy(0), fx(16), fy(19));
      ctx.fillRect(fx(laneLeft), fy(COURT_LENGTH - 19), fx(16), fy(19));

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = Math.max(3, sx * 0.22);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      ctx.strokeRect(fx(0) + 2, fy(0) + 2, W - 4, H - 4);

      ctx.beginPath();
      ctx.moveTo(fx(0), fy(COURT_LENGTH / 2));
      ctx.lineTo(fx(COURT_WIDTH), fy(COURT_LENGTH / 2));
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(fx(25), fy(47), 6 * sx, 0, Math.PI * 2);
      ctx.stroke();

      function paintEnd(top) {
        var y0 = top ? 0 : COURT_LENGTH;
        var ftY = top ? 19 : COURT_LENGTH - 19;
        var hoopY = top ? HOOP_FROM_BASELINE : COURT_LENGTH - HOOP_FROM_BASELINE;
        var boardY = top ? BACKBOARD_FROM_BASELINE : COURT_LENGTH - BACKBOARD_FROM_BASELINE;
        var sign = top ? 1 : -1;

        ctx.strokeRect(
          fx(laneLeft),
          fy(Math.min(y0, ftY)),
          fx(16),
          fy(Math.abs(ftY - y0))
        );

        ctx.beginPath();
        ctx.arc(fx(25), fy(ftY), 6 * sx, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(fx(25), fy(hoopY), 4 * sx, top ? 0 : Math.PI, top ? Math.PI : 0);
        ctx.stroke();

        var leftX = 5;
        var rightX = 45;
        var radius = 23.75;
        var dx = 25 - leftX;
        var cornerOffsetY = Math.sqrt(radius * radius - dx * dx);
        var cornerY = hoopY + sign * cornerOffsetY;
        var leftAngle = Math.atan2(sign * cornerOffsetY, -dx);
        var rightAngle = Math.atan2(sign * cornerOffsetY, dx);
        ctx.beginPath();
        ctx.moveTo(fx(leftX), fy(y0));
        ctx.lineTo(fx(leftX), fy(cornerY));
        for (var s = 1; s <= 56; s++) {
          var t = s / 56;
          var angle = leftAngle + (rightAngle - leftAngle) * t;
          ctx.lineTo(fx(25 + radius * Math.cos(angle)), fy(hoopY + radius * Math.sin(angle)));
        }
        ctx.lineTo(fx(rightX), fy(y0));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(fx(22), fy(boardY));
        ctx.lineTo(fx(28), fy(boardY));
        ctx.stroke();
      }

      paintEnd(true);
      paintEnd(false);

      var texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.needsUpdate = true;
      return texture;
    }

    var apron = new THREE.Mesh(
      new THREE.PlaneGeometry(COURT_WIDTH + 10, COURT_LENGTH + 14),
      new THREE.MeshStandardMaterial({ color: 0x5A3A22, roughness: 0.95 })
    );
    apron.rotation.x = -Math.PI / 2;
    apron.position.y = -0.04;
    apron.receiveShadow = true;
    scene.add(apron);

    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(COURT_WIDTH, COURT_LENGTH),
      new THREE.MeshStandardMaterial({
        map: createCourtTexture(),
        color: 0xffffff,
        roughness: 0.78,
        metalness: 0.02,
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    var playerGroup = new THREE.Group();
    scene.add(playerGroup);
    var pathLineGroup = new THREE.Group();
    scene.add(pathLineGroup);

    var actors = [];
    var actorsById = {};
    var ballCarrierId = null;
    var passPath = null;
    var shootPath = null;
    var shootStart = null;
    var standaloneBall = null;
    var clock = new THREE.Clock();

    function addShadowMesh(group, geometry, material, x, y, z, rotX, rotY, rotZ) {
      var mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      if (rotX) mesh.rotation.x = rotX;
      if (rotY) mesh.rotation.y = rotY;
      if (rotZ) mesh.rotation.z = rotZ;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function createHoop(atTopBaseline) {
      var group = new THREE.Group();
      var baselineZ = atTopBaseline ? -COURT_LENGTH / 2 : COURT_LENGTH / 2;
      var inward = atTopBaseline ? 1 : -1;
      var boardZ = baselineZ + inward * BACKBOARD_FROM_BASELINE;
      var rimZ = baselineZ + inward * HOOP_FROM_BASELINE;
      var poleZ = baselineZ - inward * 5.2;
      var steel = new THREE.MeshStandardMaterial({
        color: 0x2A2E33,
        metalness: 0.55,
        roughness: 0.35,
      });
      var padMat = new THREE.MeshStandardMaterial({
        color: 0x1A1D22,
        roughness: 0.7,
      });
      var glass = new THREE.MeshStandardMaterial({
        color: 0xF4F8FF,
        transparent: true,
        opacity: 0.8,
        roughness: 0.08,
        metalness: 0.15,
      });
      var orange = new THREE.MeshStandardMaterial({
        color: 0xE86100,
        roughness: 0.28,
        metalness: 0.45,
      });

      addShadowMesh(group, new THREE.BoxGeometry(4.4, 0.45, 3.2), padMat, 0, 0.22, poleZ);
      addShadowMesh(
        group,
        new THREE.CylinderGeometry(0.42, 0.5, 13.2, 20),
        steel,
        0,
        6.6,
        poleZ
      );
      var boomLen = Math.abs(boardZ - poleZ);
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.28, 0.38, boomLen),
        steel,
        0,
        12.55,
        (boardZ + poleZ) / 2
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.22, 1.4, 0.22),
        steel,
        0,
        11.9,
        boardZ - inward * 0.25
      );

      addShadowMesh(
        group,
        new THREE.BoxGeometry(6.2, 3.7, 0.08),
        steel,
        0,
        RIM_HEIGHT + 1.2,
        boardZ - inward * 0.08
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(6.0, 3.5, 0.1),
        glass,
        0,
        RIM_HEIGHT + 1.2,
        boardZ
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(2.0, 0.06, 0.04),
        orange,
        0,
        RIM_HEIGHT + 0.55,
        boardZ + inward * 0.07
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.06, 1.5, 0.04),
        orange,
        -1.0,
        RIM_HEIGHT + 1.3,
        boardZ + inward * 0.07
      );
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.06, 1.5, 0.04),
        orange,
        1.0,
        RIM_HEIGHT + 1.3,
        boardZ + inward * 0.07
      );

      var braceLen = Math.abs(rimZ - boardZ);
      addShadowMesh(
        group,
        new THREE.BoxGeometry(0.1, 0.1, braceLen),
        orange,
        0,
        RIM_HEIGHT,
        (rimZ + boardZ) / 2
      );
      var rim = addShadowMesh(
        group,
        new THREE.TorusGeometry(0.75, 0.055, 12, 32),
        orange,
        0,
        RIM_HEIGHT,
        rimZ,
        Math.PI / 2
      );
      rim.castShadow = true;

      scene.add(group);
      return group;
    }

    createHoop(true);
    createHoop(false);

    var HOOP_POSITION = new THREE.Vector3(
      0,
      RIM_HEIGHT,
      -COURT_LENGTH / 2 + HOOP_FROM_BASELINE
    );
    var HOOP_POSITION_SOUTH = new THREE.Vector3(
      0,
      RIM_HEIGHT,
      COURT_LENGTH / 2 - HOOP_FROM_BASELINE
    );

    var hoopFocus = new THREE.Vector3(
      0,
      3.6,
      HOOP_POSITION.z
    );

    function hoopForShot(from) {
      if (!from) return HOOP_POSITION;
      var dTop = Math.abs(from.z - HOOP_POSITION.z);
      var dSouth = Math.abs(from.z - HOOP_POSITION_SOUTH.z);
      return dTop <= dSouth ? HOOP_POSITION : HOOP_POSITION_SOUTH;
    }

    function ensureBall() {
      if (ballMesh && ballMesh.parent === scene) return ballMesh;
      if (ballMesh && ballMesh.parent) ballMesh.parent.remove(ballMesh);
      ballMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.48, 24, 16),
        new THREE.MeshStandardMaterial({
          color: 0xF25E22,
          roughness: 0.45,
          metalness: 0.08,
        })
      );
      ballMesh.name = 'basketball';
      ballMesh.castShadow = true;
      ballMesh.position.set(0, 1, 0);
      scene.add(ballMesh);
      return ballMesh;
    }
    ensureBall();

    var controls = null;
    if (typeof THREE.OrbitControls === 'function') {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0, 0);
      controls.minDistance = 30;
      controls.maxDistance = 280;
      controls.maxPolarAngle = Math.PI / 2 - 0.04;
    } else {
      console.error('OrbitControls failed to load');
    }

    window.setCameraView = function (viewType) {
      var isTop = viewType === 'top';
      if (isTop) {
        camera.position.set(0, 200, 0.1);
        if (controls) {
          controls.maxPolarAngle = Math.PI;
          controls.minPolarAngle = 0;
        }
      } else {
        camera.position.set(0, 90, 120);
        if (controls) {
          controls.maxPolarAngle = Math.PI / 2 - 0.04;
          controls.minPolarAngle = 0;
        }
      }
      camera.up.set(0, 1, 0);
      camera.lookAt(0, 0, 0);
      if (controls) {
        controls.target.set(0, 0, 0);
        controls.update();
      }
      camera.updateProjectionMatrix();
      if (window._currentZoomLevel) {
        window.setZoomLevel(window._currentZoomLevel);
      }
    };

    window.setZoomLevel = function (level) {
      var n = Number(level);
      if (!isFinite(n) || n <= 0) n = 1;
      window._currentZoomLevel = n;
      var targetDistance = 150 / n;
      var origin = controls ? controls.target.clone() : new THREE.Vector3(0, 0, 0);
      var dir = camera.position.clone().sub(origin);
      if (dir.lengthSq() < 1e-8) dir.set(0, 1, 0.001);
      dir.normalize().multiplyScalar(targetDistance);
      camera.position.copy(origin).add(dir);
      camera.lookAt(origin);
      if (controls) controls.update();
    };
    if (window._pendingCameraView) {
      window.setCameraView(window._pendingCameraView);
    }
    if (window._pendingZoomLevel) {
      window.setZoomLevel(window._pendingZoomLevel);
    }

    function flutterToWorld(x, y, height) {
      return new THREE.Vector3(
        (x - 0.5) * COURT_WIDTH,
        height || 0,
        (y - 0.5) * COURT_LENGTH
      );
    }

    function mapPath(rawPath, height) {
      var points = [];
      if (!rawPath) return points;
      for (var i = 0; i < rawPath.length; i++) {
        var pt = rawPath[i];
        if (!pt || pt.length < 2) continue;
        points.push(flutterToWorld(Number(pt[0]), Number(pt[1]), height || 0));
      }
      return points;
    }

    function getPositionAlongPath(points, t) {
      if (!points || !points.length) return new THREE.Vector3();
      if (points.length === 1 || t <= 0) return points[0].clone();
      if (t >= 1) return points[points.length - 1].clone();

      var total = 0;
      var lengths = [];
      for (var i = 1; i < points.length; i++) {
        var len = points[i].distanceTo(points[i - 1]);
        lengths.push(len);
        total += len;
      }
      if (total <= 0) return points[points.length - 1].clone();

      var remaining = total * t;
      for (var s = 0; s < lengths.length; s++) {
        var seg = lengths[s];
        if (remaining <= seg) {
          var u = seg === 0 ? 0 : remaining / seg;
          return points[s].clone().lerp(points[s + 1], u);
        }
        remaining -= seg;
      }
      return points[points.length - 1].clone();
    }

    function disposeGroup(group) {
      while (group.children.length) {
        var child = group.children[0];
        child.traverse(function (node) {
          if (node.geometry) node.geometry.dispose();
          if (node.material) {
            if (node.material.length) {
              for (var m = 0; m < node.material.length; m++) node.material[m].dispose();
            } else {
              node.material.dispose();
            }
          }
        });
        group.remove(child);
      }
    }

    function isFiniteVec(v) {
      return !!(v && isFinite(v.x) && isFinite(v.y) && isFinite(v.z));
    }

    function faceHoop(group) {
      if (!group) return;
      var target = hoopFocus.clone();
      target.y = group.position.y + 3.4;
      if (Math.abs(group.position.x - target.x) < 0.05 && Math.abs(group.position.z - target.z) < 0.05) {
        return;
      }
      group.lookAt(target);
    }

    function makeNumberTexture(playerNumber) {
      var canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 88px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(playerNumber), 64, 70);
      var texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createTacticalDummy(teamColor, playerNumber) {
      var group = new THREE.Group();
      var bodyMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.45,
        metalness: 0.04,
      });
      var jerseyMat = new THREE.MeshStandardMaterial({
        color: teamColor,
        roughness: 0.4,
        metalness: 0.08,
      });
      var ringMat = new THREE.MeshStandardMaterial({
        color: teamColor,
        roughness: 0.5,
        metalness: 0.12,
      });

      function addMesh(parent, geometry, material, x, y, z) {
        var mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      function makeLimb(name, x, y, radiusTop, radiusBottom, length) {
        var limb = new THREE.Group();
        limb.name = name;
        limb.position.set(x, y, 0);
        addMesh(
          limb,
          new THREE.CylinderGeometry(radiusTop, radiusBottom, length, 10),
          bodyMat,
          0,
          -length * 0.5,
          0
        );
        group.add(limb);
        return limb;
      }

      var ring = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.06, 10, 28), ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.05;
      ring.receiveShadow = true;
      group.add(ring);

      makeLimb('legL', -0.24, 1.2, 0.16, 0.18, 1.2);
      makeLimb('legR', 0.24, 1.2, 0.16, 0.18, 1.2);
      addMesh(group, new THREE.CylinderGeometry(0.46, 0.5, 1.65, 16), jerseyMat, 0, 2.45, 0);

      var numberPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.62, 0.72),
        new THREE.MeshBasicMaterial({
          map: makeNumberTexture(playerNumber),
          transparent: true,
          depthWrite: false,
        })
      );
      numberPlane.position.set(0, 2.5, -0.52);
      numberPlane.rotation.y = Math.PI;
      group.add(numberPlane);

      var armL = makeLimb('armL', -0.58, 3.15, 0.12, 0.14, 1.35);
      var armR = makeLimb('armR', 0.58, 3.15, 0.12, 0.14, 1.35);
      addMesh(group, new THREE.SphereGeometry(0.38, 16, 12), bodyMat, 0, 3.72, 0.02);

      var hold = new THREE.Object3D();
      hold.name = 'ballHold';
      hold.position.set(0.62, 3.2, 0.48);
      group.add(hold);

      var rightHand = new THREE.Object3D();
      rightHand.name = 'rightHand';
      rightHand.position.set(0, -1.35, 0.1);
      armR.add(rightHand);
      armL.userData.rest = { x: 0, y: 0, z: 0.08 };
      armR.userData.rest = { x: 0, y: 0, z: -0.08 };
      return group;
    }

    function applyDummyMotion(actor) {
      if (!actor || !actor.mesh) return;
      var armL = actor.mesh.getObjectByName('armL');
      var armR = actor.mesh.getObjectByName('armR');
      var legL = actor.mesh.getObjectByName('legL');
      var legR = actor.mesh.getObjectByName('legR');
      if (!armL || !armR || !legL || !legR) return;

      var moving =
        actor.actionType !== 'shoot' &&
        actor.path &&
        actor.path.length > 1 &&
        progress > 0 &&
        progress < 1;

      if (moving) {
        var swing = Math.sin(Date.now() * 0.01) * 0.7;
        armL.rotation.set(swing, 0, 0.08);
        armR.rotation.set(-swing, 0, -0.08);
        legL.rotation.set(-swing, 0, 0);
        legR.rotation.set(swing, 0, 0);
        return;
      }

      legL.rotation.set(0, 0, 0);
      legR.rotation.set(0, 0, 0);
      if (actor.actionType === 'shoot') {
        armL.rotation.set(-2.35, 0.12, 0.28);
        armR.rotation.set(-2.5, -0.08, -0.18);
        return;
      }
      if (actor.actionType === 'screen') {
        armL.rotation.set(-0.25, 0.2, 1.25);
        armR.rotation.set(-0.25, -0.2, -1.25);
        return;
      }
      armL.rotation.set(0, 0, 0.08);
      armR.rotation.set(0, 0, -0.08);
    }

    function faceScreenLine(actor) {
      if (!actor || !actor.mesh || !actor.path || actor.path.length < 2) {
        if (actor && actor.mesh) faceHoop(actor.mesh);
        return;
      }
      var from = actor.path[actor.path.length - 2];
      var end = actor.path[actor.path.length - 1];
      var dir = new THREE.Vector3(end.x - from.x, 0, end.z - from.z);
      if (dir.lengthSq() < 0.0001) {
        faceHoop(actor.mesh);
        return;
      }
      dir.normalize();
      var target = actor.mesh.position.clone().add(dir);
      target.y = actor.mesh.position.y + 3.4;
      actor.mesh.lookAt(target);
    }

    function applyFacing(actor) {
      if (!actor || !actor.mesh) return;
      if (actor.actionType === 'screen') {
        faceScreenLine(actor);
      } else {
        faceHoop(actor.mesh);
      }
    }

    function pathColor(actionType) {
      if (actionType === 'pass') return 0x1E88E5;
      if (actionType === 'screen') return 0x9E9E9E;
      if (actionType === 'shoot') return 0xF26A21;
      return 0xE53935;
    }

    function addPathLine(points, actionType) {
      if (!points || points.length < 2) return;
      var lifted = [];
      for (var i = 0; i < points.length; i++) {
        lifted.push(new THREE.Vector3(points[i].x, 0.12, points[i].z));
      }
      var geometry = new THREE.BufferGeometry().setFromPoints(lifted);
      var material = new THREE.LineBasicMaterial({
        color: pathColor(actionType),
        linewidth: 2,
      });
      pathLineGroup.add(new THREE.Line(geometry, material));
    }

    function addPlayer(playerId, worldPath, isOffense) {
      if (!worldPath.length) return;
      var start = worldPath[0];
      if (!isFiniteVec(start)) return;
      var color = isOffense ? 0xF26A21 : 0x2F6FE0;
      var jerseyNumber = playerId >= 11 ? playerId - 10 : playerId;
      var mesh = createTacticalDummy(color, jerseyNumber);
      mesh.userData.team = isOffense ? 'offense' : 'defense';
      mesh.position.set(start.x, 0, start.z);
      faceHoop(mesh);
      playerGroup.add(mesh);
      var hand =
        mesh.getObjectByName('ballHold') ||
        mesh.getObjectByName('rightHand');
      var actor = {
        id: playerId,
        mesh: mesh,
        path: worldPath,
        hand: hand,
        actionType: 'run',
      };
      actors.push(actor);
      actorsById[playerId] = actor;
    }

    function parseStep(raw) {
      var starts = {};
      var moves = {};
      var actionTypes = {};
      var offenseFlags = {};
      var ballCarrier = null;
      var floorBall = null;
      var pass = null;
      var shoot = null;
      var routes = [];
      var actions = (raw && raw.actions) || [];
      for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        if (!action) continue;
        if (action.actionType === 'dribble') {
          var carrier = Number(action.playerId);
          if (carrier > 0) {
            ballCarrier = carrier;
            floorBall = null;
          } else {
            ballCarrier = null;
            var floorPts = mapPath(action.path, 0);
            floorBall = floorPts.length ? floorPts[0] : null;
          }
          continue;
        }
        var id = Number(action.playerId);
        var isOffense = id >= 1 && id <= 5;
        var isDefense = id >= 11 && id <= 15;
        if (!isOffense && !isDefense) continue;
        offenseFlags[id] = isOffense;
        var worldPath = mapPath(action.path, 0);
        if (!worldPath.length) continue;
        if (worldPath.length === 1) {
          starts[id] = worldPath[0];
          if (!actionTypes[id]) actionTypes[id] = action.actionType || 'run';
        } else if (action.actionType === 'pass') {
          if (!pass || id === ballCarrier) pass = worldPath;
          if (!actionTypes[id] || actionTypes[id] === 'run') {
            actionTypes[id] = 'pass';
          }
          routes.push({ points: worldPath, actionType: 'pass' });
        } else if (action.actionType === 'shoot') {
          shoot = worldPath;
          actionTypes[id] = 'shoot';
          routes.push({ points: worldPath, actionType: 'shoot' });
        } else {
          moves[id] = worldPath;
          starts[id] = worldPath[0];
          actionTypes[id] = action.actionType;
          routes.push({ points: worldPath, actionType: action.actionType });
        }
      }
      return {
        starts: starts,
        moves: moves,
        actionTypes: actionTypes,
        offenseFlags: offenseFlags,
        ballCarrier: ballCarrier,
        floorBall: floorBall,
        pass: pass,
        shoot: shoot,
        routes: routes,
      };
    }

    function applyCurrentStep() {
      var step = playbookSteps[currentStepIndex];
      if (!step) return;
      ballCarrierId = step.ballCarrier;
      standaloneBall = step.floorBall;
      passPath = step.pass;
      shootPath = step.shoot;
      shootStart = null;
      disposeGroup(pathLineGroup);
      for (var r = 0; r < step.routes.length; r++) {
        addPathLine(step.routes[r].points, step.routes[r].actionType);
      }
      for (var i = 0; i < actors.length; i++) {
        var actor = actors[i];
        var start = step.starts[actor.id];
        var move = step.moves[actor.id];
        actor.actionType = step.actionTypes[actor.id] || 'run';
        if (move && move.length > 1) {
          actor.path = move;
        } else if (start) {
          actor.path = [start];
        } else if (actor.path && actor.path.length) {
          actor.path = [actor.path[actor.path.length - 1]];
        } else {
          actor.path = [];
        }
        var origin = actor.path[0];
        if (origin && isFiniteVec(origin)) {
          actor.mesh.position.set(origin.x, 0, origin.z);
        }
        applyFacing(actor);
        applyDummyMotion(actor);
      }
      if (shootPath) {
        var shooter = null;
        for (var s = 0; s < actors.length; s++) {
          if (actors[s].actionType === 'shoot') {
            shooter = actors[s];
            break;
          }
        }
        if (!shooter && ballCarrierId != null) shooter = actorsById[ballCarrierId];
        if (shooter && shooter.mesh) {
          shooter.mesh.updateMatrixWorld(true);
          var holdNode =
            shooter.hand ||
            shooter.mesh.getObjectByName('ballHold') ||
            shooter.mesh;
          var startWp = new THREE.Vector3();
          holdNode.getWorldPosition(startWp);
          if (isFiniteVec(startWp) && startWp.y > 1.5) {
            shootStart = startWp.clone();
          } else {
            shootStart = new THREE.Vector3(
              shooter.mesh.position.x,
              3.6,
              shooter.mesh.position.z
            );
          }
        } else if (shootPath[0]) {
          shootStart = new THREE.Vector3(shootPath[0].x, 3.6, shootPath[0].z);
        }
      }
      console.log(
        '3D step', currentStepIndex + 1, '/', playbookSteps.length,
        'ballCarrierId:', ballCarrierId,
        'pass:', !!passPath,
        'shoot:', !!shootPath
      );
    }

    function applyPlaybook(jsonString) {
      console.log('Received JSON in 3D:', jsonString);
      var playbook;
      try {
        playbook = typeof jsonString === 'string' ? JSON.parse(jsonString) : jsonString;
      } catch (err) {
        console.error('Failed to parse playbook JSON', err);
        return;
      }

      ensureBall();
      disposeGroup(playerGroup);
      disposeGroup(pathLineGroup);
      actors = [];
      actorsById = {};
      ballCarrierId = null;
      passPath = null;
      shootPath = null;
      shootStart = null;
      standaloneBall = null;
      progress = 0;
      currentStepIndex = 0;
      isPlaying3D = true;

      var rawSteps = [];
      if (Array.isArray(playbook)) {
        rawSteps = playbook;
      } else if (playbook && Array.isArray(playbook.steps)) {
        rawSteps = playbook.steps;
      }
      playbookSteps = [];
      for (var s = 0; s < rawSteps.length; s++) {
        playbookSteps.push(parseStep(rawSteps[s]));
      }

      function spawnPlayers() {
        disposeGroup(playerGroup);
        actors = [];
        actorsById = {};
        var spawned = {};
        for (var p = 0; p < playbookSteps.length; p++) {
          var starts = playbookSteps[p].starts;
          var ids = Object.keys(starts);
          for (var n = 0; n < ids.length; n++) {
            var pid = Number(ids[n]);
            if (spawned[pid]) continue;
            spawned[pid] = true;
            addPlayer(pid, [starts[pid]], pid >= 1 && pid <= 5);
          }
        }
        applyCurrentStep();
        console.log(
          'Loaded steps:', playbookSteps.length,
          'players:', actors.length
        );
      }

      spawnPlayers();
    }

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      var delta = clock.getDelta();
      if (isPlaying3D && playbookSteps.length) {
        progress += delta / duration;
        if (progress >= 1.0) {
          if (currentStepIndex < playbookSteps.length - 1) {
            currentStepIndex += 1;
            progress = 0;
            applyCurrentStep();
          } else {
            progress = 1;
            isPlaying3D = false;
          }
        }
      }

      for (var i = 0; i < actors.length; i++) {
        var actor = actors[i];
        if (actor.path && actor.path.length > 1) {
          var t = progress;
          if (actor.actionType === 'screen' && t >= 1) t = 1;
          var pos = getPositionAlongPath(actor.path, t);
          if (isFiniteVec(pos)) {
            actor.mesh.position.set(pos.x, 0, pos.z);
          }
        }
        applyFacing(actor);
        applyDummyMotion(actor);
      }

      ensureBall();
      var ballPos = new THREE.Vector3(0, 1, 0);
      if (shootPath) {
        var origin = shootStart;
        if (!origin || !isFiniteVec(origin)) {
          origin = new THREE.Vector3(
            shootPath[0] ? shootPath[0].x : 0,
            3.6,
            shootPath[0] ? shootPath[0].z : 0
          );
        }
        var hoop = hoopForShot(origin);
        var t = Math.max(0, Math.min(1, progress));
        var arcHeight = 25;
        ballPos.set(
          origin.x + (hoop.x - origin.x) * t,
          origin.y + (hoop.y - origin.y) * t + Math.sin(t * Math.PI) * arcHeight,
          origin.z + (hoop.z - origin.z) * t
        );
      } else if (passPath && passPath.length > 1) {
        var fly = getPositionAlongPath(passPath, progress);
        if (isFiniteVec(fly)) {
          ballPos.set(fly.x, 0.95 + Math.sin(progress * Math.PI) * 3.2, fly.z);
        }
      } else if (ballCarrierId != null && actorsById[ballCarrierId]) {
        var holder = actorsById[ballCarrierId];
        holder.mesh.updateMatrixWorld(true);
        var hold =
          holder.hand ||
          holder.mesh.getObjectByName('ballHold') ||
          holder.mesh;
        holder.mesh.updateMatrixWorld(true);
        var wp = new THREE.Vector3();
        hold.getWorldPosition(wp);
        if (isFiniteVec(wp) && wp.y > 1.5) {
          ballPos.copy(wp);
        } else {
          ballPos.set(
            holder.mesh.position.x + 0.7,
            holder.mesh.position.y + 3.55,
            holder.mesh.position.z + 0.55
          );
        }
      } else if (standaloneBall && isFiniteVec(standaloneBall)) {
        ballPos.set(standaloneBall.x, 1, standaloneBall.z);
      }
      if (!isFiniteVec(ballPos)) ballPos.set(0, 1, 0);
      ballMesh.position.copy(ballPos);
      ballMesh.visible = true;

      if (controls) controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.loadPlaybook = applyPlaybook;
    if (pendingPlaybookJson != null) {
      applyPlaybook(pendingPlaybookJson);
      pendingPlaybookJson = null;
    }

    console.log('Three.js Scene Initialized Successfully');
  };
</script>
